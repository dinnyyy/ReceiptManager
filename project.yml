name: ReceiptVault
options:
  bundleIdPrefix: com.receiptvault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for V1 (spec 2.2: iPad runs the iPhone experience, not a separate target)

packages:
  ReceiptVaultCore:
    path: Packages/ReceiptVaultCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0

targets:
  ReceiptVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Models
      - path: Resources
    dependencies:
      - package: ReceiptVaultCore
      - package: Supabase
        product: Supabase
      - sdk: StoreKit.framework
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptvault.app
        PRODUCT_NAME: ReceiptVault
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        NSCameraUsageDescription: "Used to scan receipts and invoices directly into your vault."
        NSPhotoLibraryUsageDescription: "Used to import receipt photos and screenshots you've already saved."
        NSPhotoLibraryAddUsageDescription: "Used to save a copy of a scanned receipt back to your photo library, if you choose to."
        NSUserNotificationsUsageDescription: "Used to remind you before an item's warranty expires."
        ITSAppUsesNonExemptEncryption: false

  ReceiptVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Unit
      - path: Tests/Integration
    dependencies:
      - target: ReceiptVault
      - package: ReceiptVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptvault.tests

  ReceiptVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: ReceiptVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.receiptvault.uitests

schemes:
  ReceiptVault:
    build:
      targets:
        ReceiptVault: all
        ReceiptVaultTests: [test]
        ReceiptVaultUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReceiptVaultTests
        - ReceiptVaultUITests
      gatherCoverage: true
    archive:
      config: Release
